name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift test
      - run: python3 -m unittest discover -s scripts/tests
      - run: zsh -n scripts/build-app.sh scripts/package-release.sh
      - run: ./scripts/build-app.sh

